name: Update Combined RSS Feed

on:
  schedule:
    - cron: '0 */6 * * *'   # Runs every 6 hours
  workflow_dispatch:         # Allows manual trigger from GitHub UI

jobs:
  build:
    permissions:
      contents: write        # Required to push the feed file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run feed builder
        run: python build_feed.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add combined.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "Update combined RSS feed"
          git push
